# Fly.io 배포 설정
# Fly 는 2026년 현재 신규 계정에 무료 요금제가 없습니다 (최소 월 $2~3 수준).
# 콜드 스타트가 싫으면 Fly, 완전 무료가 우선이면 Render 를 쓰세요.
app = "pb-dashboard"
primary_region = "nrt"        # 도쿄 — 한국에서 가장 가까움

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true          # 평문 HTTP 차단 (Basic 인증 비밀번호 보호)
  auto_stop_machines = "stop" # 트래픽 없으면 정지 → 비용 절감
  auto_start_machines = true  # 요청이 오면 자동 기동
  min_machines_running = 0

  [http_service.http_options]
    h2_backend = false

[checks.health]
  type = "http"
  port = 8080
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
