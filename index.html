};
/* 대외비 보안 : 발주금액 컬럼은 노출하지 않습니다 */
/* 연동 시스템 표기 없이 8개 컬럼만 노출 (출처 열 제외) */
/* 비고 열은 숨김 — 비고 내용은 제품 상세 팝업의 '발주 이력'에서 계속 확인합니다 */
const POCOLS=[{k:"date",t:"발주일"},{k:"product",t:"제품명",c:"nm"},
  {k:"vendor",t:"거래처 · 제조사"},
  {k:"qty",t:"발주수량",c:"qt"},{k:"due",t:"납기"},
  {k:"match",t:"크로스체크"},{k:"kind",t:"구분"},{k:"author",t:"작성자"}];
const PPCOLS=[{k:"name",t:"제품명 (스프레드시트)",c:"nm"},{k:"brand",t:"브랜드"},{k:"maker",t:"제조원"},
  {k:"count",t:"발주 횟수",c:"qt"},{k:"qty",t:"누적 수량",c:"qt"},{k:"last",t:"최근 발주일"}];
/* 발주 출처 탭 — 카운트는 출처 외 조건만 적용한 집합에서 자동 집계 */
function renderPoTabs(){
  const q=F.q.trim().toLowerCase();
  const base=recentOrders().filter(o=>{
    if(F.match&&o.match!==F.match) return false;
    if(F.owner&&o.author!==F.owner) return false;
    if(q&&![o.product,o.vendor,o.matchName,o.author,o.kind].join(" ").toLowerCase().includes(q)) return false;
    if(F.brand){ const t=o.matchKey?BY_KEY[o.matchKey]:null; if(!t||t.brand!==F.brand) return false }
    return true;
  });
  const c={all:base.length,
    domestic:base.filter(o=>o.origin==="domestic").length,
    overseas:base.filter(o=>o.origin==="overseas").length};
  $("#poTabs").innerHTML=PO_TABS.map(t=>
    `<button role="tab" aria-selected="${poOriginF===t.k}" class="${poOriginF===t.k?"on":""}" data-po="${t.k}">
       ${t.t}<span class="oc">${c[t.k]}</span></button>`).join("");
  $$("#poTabs button").forEach(b=>b.addEventListener("click",()=>{
    if(poOriginF===b.dataset.po) return;
    poOriginF=b.dataset.po; renderPo();
  }));
}
function renderPo(){
  /* 상단 요약 카운터 없음 — 목록 테이블과 필터만 노출 */
  renderPoTabs();
  /* Slack 발주 채널 버튼은 해외 발주만 보고 있을 때 숨깁니다 */
  const pb=$("#poSlack"); if(pb) pb.style.display = (poOriginF==="overseas") ? "none" : "";
  const os=fltOrders();
  /* 구체적 날짜 대신 직관적인 기준 표기 */
  $("#poNote").textContent=`${PO_FROM_LABEL} 발주 기준 · ${os.length}건`;

  if(poMode==="list"){
    $("#poListWrap").style.display=""; $("#poProdWrap").style.display="none";
    $("#poTh").innerHTML=POCOLS.map(c=>`<th data-pk="${c.k}" class="${poSortK===c.k?"srt":""}">${c.t}<span class="ar">${poSortK===c.k?(poSortD>0?"▲":"▼"):"▲"}</span></th>`).join("");
    const S=[...os].sort((a,b)=>{const A=a[poSortK]??"",B=b[poSortK]??"";
      if(typeof A==="number"&&typeof B==="number") return (A-B)*poSortD;
      return String(A).localeCompare(String(B),"ko")*poSortD});
    $("#poEmpty").style.display=S.length?"none":"block";
    $("#poTb").innerHTML=S.map(o=>{
      const t=o.matchKey?BY_KEY[o.matchKey]:null;
      return `<tr>
        <td class="dt">${esc(o.date)}${orderNewTag(o)}${orderRnwTag(o)}</td>
        <td class="nm">${t?`<button class="lk2" type="button" data-spec="${esc(o.matchKey)}" title="스펙 상세 보기">${esc(o.product)}</button>`:esc(o.product)}${t?newTag(t):""}${o.matchName&&o.matchName!==o.product?`<div style="font-size:9.5px;color:var(--tx3);font-weight:450">→ ${esc(o.matchName)}</div>`:""}</td>
        <td>${esc(o.vendor||"–")}${o.match==="name"&&t?`<div style="font-size:9.5px;color:var(--wnd)">시트: ${esc(t.maker||"미입력")}</div>`:""}</td>
        <td class="qt">${o.qty==null?'<span class="dsh">–</span>':nf(o.qty)} <span style="color:var(--tx3);font-weight:450">${esc(o.unit||"")}</span></td>
        <td class="dt">${o.due?`<span title="원문: ${esc(o.due)}">${esc(fmtDue(o.due,o.date))}</span>`:'<span class="dsh">–</span>'}</td>
        <td>${MATCH_TAG[o.match]||(o.isOverseas?'<span class="tg gray">대조 제외</span>':"")}</td>
        <td><span class="tg gray">${esc(o.kind)}</span></td>
        <td>${esc(o.author||"–")}</td>
      </tr>`;
    }).join("");
    /* 비고 펼치기 — 행 단위 토글 */
    $$("#poTb .ntgl").forEach(btn=>btn.addEventListener("click",e=>{
      e.stopPropagation();
      const row=$(`#poTb tr.noterow[data-noterow="${CSS.escape(btn.dataset.note)}"]`);
      if(!row) return;
      const on=row.classList.toggle("on");
      btn.classList.toggle("on",on);
      btn.setAttribute("aria-expanded",String(on));
      btn.title=on?"비고 접기":"비고 펼치기";
    }));
    $$("#poTh th").forEach(th=>th.addEventListener("click",()=>{
      if(poSortK===th.dataset.pk) poSortD*=-1; else {poSortK=th.dataset.pk;poSortD=1}
      renderPo();
    }));
  } else {
    $("#poListWrap").style.display="none"; $("#poProdWrap").style.display="";
    const keys=[...new Set(os.filter(o=>o.matchKey).map(o=>o.matchKey))];
    const rows=keys.map(k=>{const t=BY_KEY[k],a=t.po||{count:0,qty:0,last:null,unit:"set"};
      return {key:k,name:t.name,brand:t.brand,maker:t.maker,count:a.count,qty:a.qty,last:a.last,unit:a.unit}});
    $("#ppTh").innerHTML=PPCOLS.map(c=>`<th data-ppk="${c.k}" class="${ppSortK===c.k?"srt":""}">${c.t}<span class="ar">${ppSortK===c.k?(ppSortD>0?"▲":"▼"):"▲"}</span></th>`).join("");
    const S=[...rows].sort((a,b)=>{const A=a[ppSortK]??"",B=b[ppSortK]??"";
      if(typeof A==="number"&&typeof B==="number") return (A-B)*ppSortD;
      return String(A).localeCompare(String(B),"ko")*ppSortD});
    $("#poEmpty").style.display=S.length?"none":"block";
    $("#ppTb").innerHTML=S.map(r=>`<tr>
      <td class="nm"><button class="lk2" type="button" data-spec="${esc(r.key)}" title="스펙 상세 보기">${esc(r.name)}</button>${BY_KEY[r.key]?newTag(BY_KEY[r.key]):""}</td>
      <td>${r.brand&&r.brand!=="미정"?`<span class="tg blue">${esc(r.brand)}</span>`:'<span class="dsh">–</span>'}</td>
      <td>${esc(r.maker||"–")}</td>
      <td class="qt">${r.count}</td>
      <td class="qt">${nf(r.qty)} <span style="color:var(--tx3);font-weight:450">${esc(r.unit||"set")}</span></td>
      <td class="dt">${esc(r.last||"–")}${orderNewTag({ts:(DB.orders.find(o=>o.matchKey===r.key&&o.date===r.last)||{}).ts,date:r.last})}</td>
    </tr>`).join("");
    $$("#ppTh th").forEach(th=>th.addEventListener("click",()=>{
      if(ppSortK===th.dataset.ppk) ppSortD*=-1; else {ppSortK=th.dataset.ppk;ppSortD=1}
      renderPo();
    }));
  }
}

function renderSpecKpi(rows){

/* 탭 카운트는 원산지 외 조건만 적용한 집합에서 집계 */
function renderOriginTabs(){
  const base=DB.items.filter(it=>{
    if(!inSpecView(it)) return false;
    const q=F.q.trim().toLowerCase();
    if(F.brand&&it.brand!==F.brand) return false;
    if(F.type&&it.ptype!==F.type) return false;
    if(q){
      /* 원산지 탭 카운트도 본 목록과 동일 조건 — 품번(code) 제외 */
      const hay=[it.name,it.devName,it.brand,it.ptype,it.maker,it.ingr,it.func,it.note,it.status2].join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const c={all:base.length,
    domestic:base.filter(i=>i.origin==="domestic").length,
    overseas:base.filter(i=>i.origin==="overseas").length};
  $("#otabs").innerHTML=ORIGIN_TABS.map(t=>
    `<button role="tab" aria-selected="${originF===t.k}" class="${originF===t.k?"on":""}" data-og="${t.k}">
       ${t.t}<span class="oc">${c[t.k]}</span></button>`).join("");
  $$("#otabs button").forEach(b=>b.addEventListener("click",()=>{
    if(originF===b.dataset.og) return;
    originF=b.dataset.og;
    selBrand=null; $("#bdet").classList.remove("on");   // 구분 변경 시 펼친 상세는 닫음
    render();
  }));
}
function renderBrandGrid(rows){
  const bm={};rows.forEach(r=>{(bm[r.brand]=bm[r.brand]||[]).push(r)});
  const bs=Object.entries(bm).sort((a,b)=>b[1].length-a[1].length);
  if(!bs.length){ $("#bgrid").innerHTML=`<div class="mt" style="grid-column:1/-1"><img class="ch-empty" alt="" src="${CHARS.empty}">조건에 맞는 품목이 없습니다.</div>`; return }
  $("#bgrid").innerHTML=
    `<button class="bcard all ${selBrand===ALL?"sel":""}" data-brand="${ALL}">
      <div class="bn">전체 브랜드</div>
      <div class="bc">${rows.length}개 품목</div>
      <div class="barr">→</div></button>`
    /* 카드에는 브랜드명 · 총 품목 수 · 화살표만 노출 (유형/발주 태그 제거) */
    + bs.map(([b,list])=>
      `<button class="bcard ${selBrand===b?"sel":""}" data-brand="${esc(b)}" style="background:${brandColor(b).g}">
        <div class="bn">${esc(b)}${list.some(isNew)
          ?`<span class="bnew" title="신규 등록 ${list.filter(isNew).length}건">NEW</span>`:""}</div>
        <div class="bc">${list.length}개 품목</div>
        <div class="barr">→</div></button>`).join("");
  $$("#bgrid .bcard").forEach(el=>el.addEventListener("click",()=>{
    const b=el.dataset.brand;
    if(selBrand===b){ closeBrand(); return }
    selBrand=b; renderBrandGrid(rows); openBrand(rows);
  }));
}
/* 요청 규격 : 제품명 · 제품유형 · 포장단위 · 단위중량 · 소비기한 · 제조원 (6열) */
const BDCOLS=[{k:"name",t:"제품명",c:"nm"},{k:"ptype",t:"제품유형"},{k:"pack",t:"포장단위"},
  {k:"unitWeight",t:"단위중량"},{k:"shelf",t:"소비기한"},{k:"maker",t:"제조원"}];
function renderBrandDetail(rows){
  const isAll=(selBrand===ALL||selBrand===null);
  const list=isAll?rows:rows.filter(r=>r.brand===selBrand);
  const label=isAll?"전체 브랜드":selBrand;
  const col=isAll?{g:"linear-gradient(140deg,#5b6480,#404859)"}:brandColor(selBrand);
  $("#bdSw").style.background=col.g;
  $("#bdName").textContent=label;
  const types=uniq(list.map(r=>r.ptype)), makers=uniq(list.map(r=>r.maker));
  $("#bdSub").textContent=`${list.length}개 품목`;
  $("#bdTh").innerHTML=BDCOLS.map(c=>`<th data-bk="${c.k}" class="${bdSortK===c.k?"srt":""}">${c.t}<span class="ar">${bdSortK===c.k?(bdSortD>0?"▲":"▼"):"▲"}</span></th>`).join("");
  const gv=(r,k)=>Array.isArray(r[k])?r[k].join(", "):(r[k]??"");
  const S=[...list].sort((a,b)=>{const A=gv(a,bdSortK),B=gv(b,bdSortK);
    if(typeof A==="number"&&typeof B==="number") return (A-B)*bdSortD;
    if(!A&&!B)return 0;if(!A)return 1;if(!B)return -1;
    return String(A).localeCompare(String(B),"ko")*bdSortD});
  $("#bdEmpty").style.display=S.length?"none":"block";
  $("#bdTb").innerHTML=S.map(r=>`<tr>
      <td class="nm"><button class="lk2" type="button" data-spec="${esc(r.key)}" title="스펙 상세 보기">${esc(r.name)}</button>${newTag(r)}</td>
      <td>${r.ptype?`<span class="tg gray">${esc(r.ptype)}</span>`:'<span class="dsh">–</span>'}</td>
      <td>${r.pack?esc(r.pack):'<span class="dsh">–</span>'}</td>
      <td class="dt">${r.unitWeight?esc(r.unitWeight):'<span class="dsh">–</span>'}</td>
      <td class="dt">${r.shelf?esc(r.shelf):'<span class="dsh">–</span>'}</td>
      <td>${r.maker?esc(r.maker):'<span class="dsh">–</span>'}</td>
    </tr>`).join("");
  $$("#bdTh th").forEach(th=>th.addEventListener("click",()=>{
    if(bdSortK===th.dataset.bk) bdSortD*=-1; else {bdSortK=th.dataset.bk;bdSortD=1}
    renderBrandDetail(rows);
  }));
}
function openBrand(rows){
  renderBrandDetail(rows);
  $("#bdet").classList.add("on");
  setTimeout(()=>{const el=$("#bdet"); if(el&&el.scrollIntoView) el.scrollIntoView({behavior:"smooth",block:"start"})},120);
}
function closeBrand(){
  selBrand=null; $("#bdet").classList.remove("on"); renderBrandGrid(flt());
  const g=$("#bgrid"); if(g&&g.scrollIntoView) g.scrollIntoView({behavior:"smooth",block:"center"});
}
$("#bdClose").addEventListener("click",closeBrand);

/* ═══════ 오케스트레이션 ═══════ */
const VMETA={dev:{t:"제품 개발 현황"},po:{t:"발주 현황"},spec:{t:"제품 정보 라이브러리"}};
function render(){ try{ render_(); }catch(e){
    console.error(e);
    toast("화면 렌더 중 오류: "+e.message,"err");
  } }
function render_(){
  if(curView==="po"){
    const os=fltOrders();
    $("#rcNow").textContent=os.length; $("#rcAll").textContent=DB.orders.length;
  }else{
    const rows=flt(), scope=scopeItems();
    $("#rcNow").textContent=rows.length; $("#rcAll").textContent=scope.length;
  }
  const N={plan:"기획/검토",dev:"개발/샘플",mass:"양산/출시 대기",risk:"지연·이슈"};
  $("#rcNote").textContent=kpiF?` · KPI: ${N[kpiF]}`:"";
  /* 적용 중인 필터 개수 = 검색어·드롭다운·세그먼트·KPI·원산지 탭 전부 합산 */
  const cnt=Object.values(F).filter(Boolean).length+(srcF?1:0)+(kpiF?1:0)
          +((curView==="spec"&&originF!=="all")?1:0)+(selBrand?1:0)
          +((curView==="po"&&poOriginF!=="all")?1:0);
  $("#fCnt").textContent=cnt?`적용 ${cnt}건`:"";
  const rb=$("#reset");
  if(rb){
    rb.classList.toggle("idle",!cnt); rb.classList.toggle("act",!!cnt);
    rb.disabled=!cnt;
    const fb=$("#fBadge"); if(fb) fb.textContent=cnt;
  }
  $("#ncDev").textContent=DB.items.filter(inDevView).length;
  $("#ncSpec").textContent=DB.items.filter(inSpecView).length;
  $("#ncPo").textContent=recentOrders().length;
  refreshSrc();
  if(curView==="dev"){ const rows=flt(); renderDevKpi(rows); renderCats(rows); renderGantt(rows) }
  else if(curView==="po"){ renderPo() }
  else{ const rows=flt(); renderOriginTabs(); renderSpecKpi(rows); renderBrandGrid(rows);
        if(selBrand!==null||$("#bdet").classList.contains("on")) renderBrandDetail(rows) }
}
function goView(v){
  curView=v; selBrand=null; kpiF=null; srcF=""; F.match=""; originF="all"; poOriginF="all";
  $("#bdet").classList.remove("on"); $("#fMatch").value="";
  $$("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  $$(".view").forEach(s=>s.classList.remove("on"));
  $("#v-"+v).classList.add("on");
  $("#vTitle").textContent=VMETA[v].t;
  $$(".kpi").forEach(e=>e.classList.remove("active"));
  const dev=v==="dev", po=v==="po";
  $("#wOwner").classList.toggle("hide",!(dev||po));
  $("#wStage").classList.toggle("hide",!dev);
  $("#wType").classList.toggle("hide",po);
  $("#wMatch").classList.toggle("hide",!po);
  buildSelects(); render();
  if(window.innerWidth<=1080) $("#sb").classList.remove("open");
}
(function bind(){
  const M={fBrand:"brand",fType:"type",fOwner:"owner",fStage:"stage",fMatch:"match"};
  Object.entries(M).forEach(([id,k])=>$("#"+id).addEventListener("change",e=>{F[k]=e.target.value;render()}));
  /* 마스코트 이미지 주입 — data-ch 속성이 있는 요소 + 고정 id 2곳 */
  $$("[data-ch]").forEach(el=>{ el.src = CHARS[el.dataset.ch] || "" });
  if($("#chMascot")) $("#chMascot").src = CHARS.mascot;
  if($("#chModal"))  $("#chModal").src  = CHARS.modal;

  /* 로고 클릭 → 대시보드 홈(초기 상태)으로 */
  $("#homeBtn").addEventListener("click",()=>{ goView("dev"); toast("대시보드 홈으로 초기화했습니다") });
  /* 검색창 : 300ms 디바운스 — 타이핑이 멈춘 뒤 한 번만 필터링 */
  let t;$("#fQ").addEventListener("input",e=>{clearTimeout(t);t=setTimeout(()=>{F.q=e.target.value;render()},300)});
  $("#reset").addEventListener("click",()=>{
    Object.keys(F).forEach(k=>F[k]="");Object.keys(M).forEach(id=>$("#"+id).value="");
    $("#fQ").value="";kpiF=null;srcF="";selBrand=null;originF="all";poOriginF="all";$("#bdet").classList.remove("on");
    $$(".kpi").forEach(e=>e.classList.remove("active"));
    render();
  });
  $$(".kpi:not(.static)").forEach(el=>el.addEventListener("click",()=>{
    const k=el.dataset.k; kpiF=(kpiF===k||k==="all")?null:k;
    $$(".kpi").forEach(e=>e.classList.toggle("active",e.dataset.k===kpiF)); render();
  }));
  $$("#nav button").forEach(b=>b.addEventListener("click",()=>goView(b.dataset.v)));
  $$("#devMode button").forEach(b=>b.addEventListener("click",()=>{
    devMode=b.dataset.m;
    $$("#devMode button").forEach(x=>x.classList.toggle("on",x===b));
    $("#devKb").style.display=devMode==="kb"?"":"none";
    $("#devGt").style.display=devMode==="gt"?"":"none";
    $("#devPanelT").textContent=devMode==="kb"?"상태별 진행 보드":"개발 일정 타임라인";
  }));
  $("#kbToggle").addEventListener("click",()=>{hideEmpty=!hideEmpty;renderCats(flt())});
  $$("#poMode button").forEach(b=>b.addEventListener("click",()=>{
    poMode=b.dataset.m; $$("#poMode button").forEach(x=>x.classList.toggle("on",x===b)); renderPo();
  }));
  $("#gM").addEventListener("click",()=>{gMode="month";$("#gM").classList.add("on");$("#gQ").classList.remove("on");renderGantt(flt())});
  $("#gQ").addEventListener("click",()=>{gMode="quarter";$("#gQ").classList.add("on");$("#gM").classList.remove("on");renderGantt(flt())});
  $("#themeBtn").addEventListener("click",()=>{
    const p=document.documentElement.dataset.theme==="light";
    document.documentElement.dataset.theme=p?"dusk":"light";
    $("#themeBtn").title=p?"라이트 모드로 전환":"더스크 모드로 전환";
  });
  $("#autoBtn").addEventListener("click",()=>{
    autoOn=!autoOn;
    $("#autoBtn").classList.toggle("off",!autoOn);
    $("#autoBtn").title=autoOn?"자동 동기화 끄기":"자동 동기화 켜기";
    if(autoOn) autoLeft=NOTION_CONFIG.autoSyncMin*60;
    toast(autoOn?`자동 동기화 ON (${NOTION_CONFIG.autoSyncMin}분)`:"자동 동기화 OFF");
  });
  $("#sbTg").addEventListener("click",()=>$("#sb").classList.toggle("open"));
})();

window.addEventListener("error",e=>{
  console.error(e.error||e.message);
  try{ toast(" 스크립트 오류: "+(e.message||"unknown"),"err") }catch(_){}
});
goView("dev"); refreshSrc(); paintSyncBar(null);
if(SHEET_CONFIG.csvUrl||NOTION_CONFIG.relayUrl||NOTION_CONFIG.apiKey||SLACK_CONFIG.relayUrl||SLACK_CONFIG.botToken)
  setTimeout(()=>syncAll(true),700);
</script>
</body>
</html>
